<h2 id="結論">結論</h2>
<p>歸納與傳導即使同資料同架構仍強互補；以歸納為主、傳導兜底的集成逼近人類平均（ARC 56.75% / 後續 61.9%）。互補性源於兩者本質不同的歸納偏好，而非隨機性。seed→LLM remix 的合成資料方法可遷移；人工標註很快飽和、算力可換效能。</p>
